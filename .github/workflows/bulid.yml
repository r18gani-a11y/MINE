name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-setuptools \
            autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Upgrade pip and install build tools
        run: |
          python3 -m pip install --upgrade pip setuptools wheel virtualenv
          pip install buildozer cython==0.29.36

      - name: Create buildozer.spec automatically
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = MINE Store
          package.name = minestore
          package.domain = org.r18ganistore
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,ttf,otf,json
          source.exclude_exts = spec
          source.exclude_dirs = tests, bin, .github, .buildozer, .git, __pycache__
          version = 1.0.0
          requirements = python3,kivy==2.2.1,kivymd==1.1.1,pillow
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.ndk_api = 21
          android.accept_sdk_license = True
          android.archs = arm64-v8a, armeabi-v7a
          android.allow_backup = True
          android.skip_update = False
          p4a.branch = master
          android.copy_libs = 1
          android.release_artifact = apk
          android.debug_artifact = apk

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK with Buildozer
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mine-store-apk
          path: bin/*.apk
          if-no-files-found: error
