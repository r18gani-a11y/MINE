name: Build MINE APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer
        run: |
          pip install buildozer cython==0.29.36
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk zip unzip -qq
          echo "y" | sudo apt-get install -y openjdk-17-jdk

      - name: Create perfect buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = MINE Store
          package.name = minestore
          package.domain = com.mine.store
          source.dir =.
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 0.1
          requirements = python3,kivy==2.3.0
          orientation = portrait
          fullscreen = 0

          [buildozer]
          log_level = 2

          [app:android]
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          EOF
          cat buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MINE-APK
          path: bin/*.apk
